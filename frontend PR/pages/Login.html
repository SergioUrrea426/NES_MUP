<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - NESS SOFT</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ness: {
                            50: '#eef8ff',
                            100: '#d8f0ff',
                            500: '#00a2e8', /* Azul Cyan */
                            600: '#0284c7',
                            800: '#0b3b80', /* Azul Oscuro NESS */
                            900: '#072758',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="../css/login.css">
</head>
<!-- Estilos y degradado Personalizado del background -->
<body class="min-h-screen flex items-center justify-center p-4 font-sans antialiased bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-sky-200 via-sky-700 to-slate-950">

    <main class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl overflow-hidden border border-slate-200">
        
        <!-- Header con el Logo NESS SOFT -->
        <header class="px-8 pt-8 pb-4 text-center">
            <div class="flex justify-center mb-3">
                <img src="../img/NESSlogoopti.png" alt="NESS SOFT Logo" class="h-24 w-auto object-contain transition-all duration-300 hover:scale-105">
            </div>
            <h1 class="text-xl font-bold text-ness-800 tracking-tight">CRM - CORPORATIVO</h1>
            <p class="text-xs text-slate-500 mt-1 uppercase tracking-wider font-semibold">Bienvenido a la plataforma</p>
        </header>

        <!-- Formulario -->
        <form id="loginForm" class="px-8 pb-8 space-y-4" novalidate>
            
            <!-- Correo Electrónico / Perfil -->
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico/Perfil</label>
                <div class="relative rounded-lg shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                    <input type="email" id="email" name="email" required
                        class="input-field block w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-ness-500 focus:border-ness-500 focus:bg-white transition-all duration-200" 
                        placeholder="usuario@nesssoft.com">
                </div>
                <span id="emailError" class="text-xs text-red-500 hidden mt-1">Por favor ingresa un correo válido.</span>
            </div>

            <!-- Contraseña -->
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label for="password" class="block text-sm font-medium text-slate-700">Contraseña</label>
                    <a href="mailto:soporte@nesssoft.com?subject=Recuperar%20contrase%C3%B1a" class="text-xs font-semibold text-ness-500 hover:text-ness-800 transition-colors">¿Olvidaste tu contraseña?</a>
                </div>
                <div class="relative rounded-lg shadow-sm">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <input type="password" id="password" name="password" required
                        class="input-field block w-full pl-10 pr-10 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-ness-500 focus:border-ness-500 focus:bg-white transition-all duration-200" 
                        placeholder="••••••••">
                    <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none">
                        <i class="fa-regular fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
                <span id="passwordError" class="text-xs text-red-500 hidden mt-1">La contraseña no puede estar vacía.</span>
            </div>

            <!-- Opción Recordarme -->
            <div class="flex items-center justify-between pt-1">
                <div class="flex items-center">
                    <input id="remember-me" name="remember-me" type="checkbox" 
                        class="h-4 w-4 text-ness-800 focus:ring-ness-500 border-slate-300 rounded cursor-pointer">
                    <label for="remember-me" class="ml-2 block text-sm text-slate-600 cursor-pointer select-none">
                        Recordarme en este dispositivo
                    </label>
                </div>
            </div>

            <!-- Botón de Envío -->
            <button type="submit" id="submitBtn"
                class="w-full mt-2 bg-gradient-to-r from-ness-800 to-ness-500 hover:from-ness-900 hover:to-ness-800 text-white font-medium py-2.5 px-4 rounded-lg shadow-lg shadow-ness-800/30 focus:outline-none focus:ring-2 focus:ring-ness-500 focus:ring-offset-2 transition-all duration-200 text-sm flex items-center justify-center gap-2">
                <span id="btnText">Ingresar al Sistema</span>
                <i class="fa-solid fa-arrow-right text-xs" id="btnIcon"></i>
            </button>

            <!-- Separador -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-200"></div>
                </div>
                <div class="relative flex justify-center text-xs uppercase">
                    <span class="bg-white px-3 text-slate-400 font-semibold tracking-wider">Ingreso Seguro</span>
                </div>
            </div>

<!-- Botón 2FA con Degradado Sutil y Cristalino -->
<div class="flex justify-center">
    <button type="button" 
        class="w-full group relative flex items-center justify-between px-4 py-2.5 rounded-xl bg-gradient-to-r from-sky-50/90 via-sky-100/60 to-slate-50/90 hover:from-sky-100 hover:via-sky-200/50 hover:to-sky-50 border border-sky-200/80 hover:border-sky-400/80 text-slate-700 shadow-sm hover:shadow-md hover:shadow-sky-500/10 transition-all duration-300">
        
        <!-- Icono con degradado en el contenedor -->
        <span class="flex items-center justify-center w-7 h-7 rounded-lg bg-gradient-to-br from-ness-800 to-sky-600 text-white shadow-sm shadow-ness-800/20 group-hover:scale-105 transition-transform duration-200 shrink-0">
            <i class="fa-solid fa-shield-halved text-xs"></i>
        </span>
        
        <!-- Textos armónicos -->
        <div class="flex flex-col text-center mx-auto">
            <span class="text-[11px] font-bold text-ness-900 uppercase tracking-wider group-hover:text-sky-700 transition-colors">
                Autenticación 2FA
            </span>
            <span class="text-[10px] text-slate-500 font-medium group-hover:text-slate-600 transition-colors">
                Doble Factor de Autenticación
            </span>
        </div>

        <!-- Flecha con destello al pasar el cursor -->
        <i class="fa-solid fa-chevron-right text-[10px] text-sky-500/70 group-hover:text-sky-600 group-hover:translate-x-0.5 transition-all duration-200 shrink-0"></i>
    </button>
</div>

        <!-- Footer -->
        <footer class="px-8 py-4 bg-slate-50/80 border-t border-slate-100 text-center">
            <p class="text-xs text-slate-500">
                ¿Necesitas acceso? 
                <a href="mailto:soporte@nesssoft.com" class="font-semibold text-ness-800 hover:text-ness-500 transition-colors">Contactar a soporte</a>
            </p>
        </footer>

    </main>

    <!-- Script Lógico -->
    <script src="../js/login.js"></script>
</body>
</html>
